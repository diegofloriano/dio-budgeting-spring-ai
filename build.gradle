plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'budgeting.com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
	// Lombok com versão explícita para garantir o Annotation Processor
	compileOnly 'org.projectlombok:lombok:1.18.34'
	annotationProcessor 'org.projectlombok:lombok:1.18.34'
	testCompileOnly 'org.projectlombok:lombok:1.18.34'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation platform("org.springframework.ai:spring-ai-bom:2.0.0-M4")
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'
}

// Permite ao Lombok manipular a árvore de sintaxe (AST) no compilador do Java
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += [
			'--add-opens', 'jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
			'--add-opens', 'jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
			'--add-opens', 'jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
			'--add-opens', 'jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
			'--add-opens', 'jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
			'--add-opens', 'jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
			'--add-opens', 'jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
			'--add-opens', 'jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
			'--add-opens', 'jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
			'--add-opens', 'jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED'
	]
}

tasks.named('test') {
	useJUnitPlatform()
}